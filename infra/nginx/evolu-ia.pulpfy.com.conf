# evolu-ia.pulpfy.com — app Evolu-IA (Next standalone em 127.0.0.1:3140). Instalado em /etc/nginx/sites-available/.
# Demo com dados exclusivamente sintéticos, atrás de login OIDC com MFA. Cabeçalhos de segurança vêm do app.
server {
    server_name evolu-ia.pulpfy.com;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Uploads: limite do app é UPLOAD_MAX_BYTES (10 MiB) + folga do multipart.
    client_max_body_size 12m;
    # Não registra query strings (podem conter códigos OIDC) no access log.
    access_log /var/log/nginx/evolu-ia.access.log combined_noquery;

    location / {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/evolu-ia.pulpfy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/evolu-ia.pulpfy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name evolu-ia.pulpfy.com;
    return 301 https://$host$request_uri;
}
