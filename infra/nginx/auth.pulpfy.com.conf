# auth.pulpfy.com — Zitadel self-hosted (IdP do Evolu-IA). Instalado em /etc/nginx/sites-available/.
# Equivale ao roteamento do Traefik do compose oficial do Zitadel v4:
#   /              → login v2 (/ui/v2/login/)
#   /ui/v2/login   → contêiner zitadel-login
#   /api/...       → API com prefixo removido
#   resto          → API (OIDC, console, gRPC-web/Connect)
server {
    server_name auth.pulpfy.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 5m;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location = / {
        proxy_pass http://127.0.0.1:3141/ui/v2/login/;
    }
    location /ui/v2/login {
        proxy_pass http://127.0.0.1:3141;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8140/;
    }
    location / {
        proxy_pass http://127.0.0.1:8140;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auth.pulpfy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.pulpfy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.pulpfy.com;
    return 301 https://$host$request_uri;
}
