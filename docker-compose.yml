# Evolu-IA — stack da VPS. Todas as portas publicadas apenas em 127.0.0.1; o nginx do host termina TLS.
name: evolu-ia

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      EVOLU_OWNER_PASSWORD: ${EVOLU_OWNER_PASSWORD:?}
      EVOLU_APP_PASSWORD: ${EVOLU_APP_PASSWORD:?}
      EVOLU_WORKER_PASSWORD: ${EVOLU_WORKER_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

volumes:
  pgdata:
